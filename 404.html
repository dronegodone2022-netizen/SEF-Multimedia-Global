<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SEF Multimedia Global | Creative Agency</title>
    <script>
      (function () {
        var locationPath = window.location.pathname;
        var base = '/SEF-Multimedia-Global';
        var route = locationPath.indexOf(base) === 0 ? locationPath.slice(base.length) : locationPath;
        var query = window.location.search ? window.location.search + '&' : '?';
        window.location.replace(base + '/' + query + 'p=' + encodeURIComponent(route + window.location.hash));
      })();
    </script>
  </head>
  <body></body>
</html>
